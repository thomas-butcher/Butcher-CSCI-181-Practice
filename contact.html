<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <title>Contact - Thomas Butcher's Portfolio</title>
  </head>

  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <header id="page-header">
      <img
        src="./images/tblogo.png"
        alt="Thomas Butcher logo"
        width="64"
        height="64"
      />
      <span>Thomas Butcher</span>
      <nav aria-label="Primary navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="resume.html">Resume</a></li>
          <li><a href="weather.html">Weather</a></li>
          <li><a href="contact.html" aria-current="page">Contact</a></li>
        </ul>
      </nav>
      <button id="theme-toggle" type="button">Switch to Dark Mode</button>
    </header>
    <main id="main-content">
      <h1>Contact</h1>
      <h2>Email:</h2>
      <p>
        <a href="mailto:thomasbutcher@outlook.com">thomasbutcher@outlook.com</a>
      </p>
      <h2>Phone Number:</h2>
      <p>(907) 315-3348</p>
      <h2>Contact Form</h2>
      <section id="contact">
        <form>
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required />

          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />

          <p></p>
          <label for="message">Message:</label>
          <textarea id="message" name="message" rows="5" required></textarea>

          <p></p>
          <button type="submit">Send Your Message</button>
        </form>
      </section>
    </main>
    <script src="./scripts/theme.js"></script>
  </body>
</html>
